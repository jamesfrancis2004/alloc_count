[package]
name = "alloc_count"
version = "0.4.0"
edition = "2021"
description = "A lightweight tool to count allocations within a specific scope using a custom global allocator."
license = "MIT OR Apache-2.0"
keywords = ["allocator", "profiling", "memory", "testing"]
categories = ["development-tools::profiling", "memory-management"]
repository = "https://github.com/jamesfrancis2004/alloc_count"


[features]
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1.0", features = ["rt", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
rayon = "1.10"
serial_test = "3.1"

[[example]]
name = "async"
required-features = ["tokio"]

[[test]]
name = "test_async"
required-features = ["tokio"]
